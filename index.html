<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Livre</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;min-height:100dvh;overflow:hidden;background:#000;font-family:Arial,Helvetica,sans-serif}
body{position:fixed;inset:0;background:#000;overscroll-behavior:none}
#cover{position:fixed;top:0;right:0;bottom:0;left:0;width:100vw;height:100dvh;background:#000;z-index:10;cursor:pointer}
#stage{position:fixed;top:0;right:0;bottom:0;left:0;width:100vw;height:100dvh;background:#000;display:none;z-index:20;color:#777}
#word{position:absolute;left:3vw;right:3vw;top:max(6px,env(safe-area-inset-top));text-align:center;font-weight:600;white-space:nowrap;line-height:1;opacity:1;font-size:150px;color:#0d0d0d}
</style>
</head>
<body>
<div id="cover" aria-label="Touchez pour commencer"></div>

<div id="stage"><div id="word"></div></div>

<script>
(() => {
  const BOOK_LINES = [
    "Quelques années après les ravages de la",
    "Seconde Guerre mondiale, cette zone",
    "reculée, abritant une population",
    "vieillissante, s’était progressivement",
    "dépeuplée, livrant les bâtisses aux morsures",
    "du temps. Aujourd’hui, seules subsistaient",
    "des ruines qu’une association, « Zéro onde »,",
    "financée en majorité par le conseil régional",
    "du Grand Est, avait entrepris de réhabiliter.",
    "Emmitouflée dans son épaisse écharpe en",
    "laine, sa chapka kaki enfoncée jusqu’aux",
    "oreilles, Véra Clétorne regagnait la base que",
    "les membres de l’association, dont elle",
    "faisait partie, avaient aménagée dans ce qui",
    "avait autrefois tenu lieu de boulangerie. Des",
    "ouvriers avaient confectionné une toiture",
    "temporaire, faite de planches et de bâches",
    "en plastique, et reconstruit les murs",
    "entourant l’ancien four. Il faisait aussi froid",
    "dedans que dehors, mais, au moins, on était",
    "au sec et protégé du vent. Là, on avait"
  ];

  const cover = document.getElementById("cover");
  const stage = document.getElementById("stage");
  const wordEl = document.getElementById("word");
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  let rec = null;
  let running = false;
  let locked = false;
  let spokenPage = null;
  let spokenLine = null;
  let spokenWord = null;

  function normalize(s){
    return s.toLowerCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
      .replace(/[’']/g," ")
      .replace(/[^a-z0-9\s-]/g," ")
      .replace(/\s+/g," ").trim();
  }

  function splitBookWords(line){
    const matches = line.match(/[A-Za-zÀ-ÖØ-öø-ÿŒœÆæ]+(?:[’'][A-Za-zÀ-ÖØ-öø-ÿŒœÆæ]+)*/g) || [];
    return matches.filter(w => w.replace(/[^A-Za-zÀ-ÖØ-öø-ÿŒœÆæ]/g,"").length >= 2);
  }

  const simple = {
    "zero":0,"un":1,"une":1,"deux":2,"trois":3,"quatre":4,"cinq":5,
    "six":6,"sept":7,"huit":8,"neuf":9,"dix":10,"onze":11,"douze":12,
    "treize":13,"quatorze":14,"quinze":15,"seize":16,"dix sept":17,
    "dix huit":18,"dix neuf":19,"vingt":20,"vingt et un":21
  };
  const ordinals = {
    "premier":1,"premiers":1,"premiere":1,"premieres":1,"deuxieme":2,"deuxiemes":2,"second":2,"seconde":2,
    "troisieme":3,"quatrieme":4,"cinquieme":5,"sixieme":6,"septieme":7,
    "huitieme":8,"neuvieme":9,"dixieme":10,
    "onzieme":11,"douzieme":12,"treizieme":13,"quatorzieme":14,
    "quinzieme":15,"seizieme":16,"dix septieme":17,"dix huitieme":18,
    "dix neuvieme":19,"vingtieme":20,"vingt et unieme":21
  };

  function readNumber(s){
    s = normalize(s).replace(/-/g," ").trim();
    const d = s.match(/\b(\d{1,2})\b/);
    if(d) return Number(d[1]);
    if(simple[s] !== undefined) return simple[s];
    if(ordinals[s] !== undefined) return ordinals[s];

    for(const [k,v] of Object.entries({...simple,...ordinals})){
      if(new RegExp("\\b"+k.replace(/ /g,"\\s+")+"\\b").test(s)) return v;
    }
    return null;
  }

  function parseCommand(text){
    const t = normalize(text).replace(/-/g," ");

    // Very common short forms:
    // "ligne 2 mot 1", "ligne 2 premier mot", "ligne deux premier mot".
    let quick = t.match(/^ligne\s+(.+?)\s+mot\s+(.+)$/);
    if(quick) return {page:null, line:readNumber(quick[1]), word:readNumber(quick[2])};

    quick = t.match(/^ligne\s+(.+?)\s+(.+?)\s+mot$/);
    if(quick) return {page:null, line:readNumber(quick[1]), word:readNumber(quick[2])};

    // Ex. "page 12 ligne 5 mot 4"
    let m = t.match(/\bpage\s+(.+?)\s+ligne\s+(.+?)\s+(?:mot|mots)\s+(.+)$/);
    if(m) return {page:readNumber(m[1]), line:readNumber(m[2]), word:readNumber(m[3])};

    m = t.match(/\bligne\s+(.+?)\s+(?:mot|mots)\s+(.+)$/);
    if(m) return {page:null, line:readNumber(m[1]), word:readNumber(m[2])};

    // Ex. "ligne 2 premier mot" ou "ligne deux quatrième mot"
    m = t.match(/\bligne\s+(.+?)\s+(.+?)\s+(?:mot|mots)$/);
    if(m) return {page:null, line:readNumber(m[1]), word:readNumber(m[2])};

    m = t.match(/\b(?:mot|mots)\s+(.+?)\s+ligne\s+(.+)$/);
    if(m) return {page:null, line:readNumber(m[2]), word:readNumber(m[1])};

    let page=null, line=null, word=null;

    const pageMatch = t.match(/\bpage\s+([^ ]+(?:\s+et\s+un)?)/);
    if(pageMatch) page=readNumber(pageMatch[1]);

    // Ex. "cinquième ligne, quatrième mot"
    for(const [k,v] of Object.entries(ordinals)){
      const kk=k.replace(/ /g,"\\s+");
      if(new RegExp("\\b"+kk+"\\s+ligne\\b").test(t) || new RegExp("\\bligne\\s+"+kk+"\\b").test(t)) line=v;
      if(new RegExp("\\b"+kk+"\\s+mot\\b").test(t) || new RegExp("\\bmot\\s+"+kk+"\\b").test(t)) word=v;
    }

    if(line===null){
      const lm=t.match(/\bligne\s+([^ ]+(?:\s+et\s+un)?)/);
      if(lm) line=readNumber(lm[1]);
    }
    if(word===null){
      const wm=t.match(/\b(?:mot|mots)\s+([^ ]+(?:\s+et\s+un)?)/);
      if(wm) word=readNumber(wm[1]);
    }

    return {page,line,word};
  }

  function fitWord(){
    if(!wordEl.textContent) return;
    let size=Math.min(320,Math.floor(innerWidth*0.76));
    wordEl.style.fontSize=size+"px";
    const max=innerWidth*0.96;
    while(wordEl.scrollWidth>max && size>18){
      size-=2;
      wordEl.style.fontSize=size+"px";
    }
  }


  async function enterFullscreen(){
    try{
      const el=document.documentElement;
      if(!document.fullscreenElement && el.requestFullscreen){
        await el.requestFullscreen({navigationUI:"hide"});
      }
    }catch(e){}
  }

  function extractStandaloneNumber(text){
    const t=normalize(text).replace(/-/g," ").trim();

    // If the user says "page 12", "ligne 5" or "mot 4",
    // keep only the numerical part.
    const labelled=t.match(/\b(?:page|ligne|mot|mots)\s+(.+)$/);
    if(labelled){
      const n=readNumber(labelled[1]);
      if(Number.isInteger(n)) return n;
    }

    return readNumber(t);
  }

  function resetSpokenCommand(){
    spokenPage=null;
    spokenLine=null;
    spokenWord=null;
  }

  function handleSpeech(text){
    if(locked) return;

    // First try a complete command such as:
    // "page 12 ligne 5 mot 4".
    const full=parseCommand(text);
    if(full.line && full.word){
      spokenPage=full.page;
      spokenLine=full.line;
      spokenWord=full.word;
      reveal(spokenLine,spokenWord);
      return;
    }

    // Otherwise accept three successive spoken values:
    // page -> line -> word.
    const n=extractStandaloneNumber(text);
    if(!Number.isInteger(n)) return;

    if(spokenPage===null){
      spokenPage=n;
      return;
    }
    if(spokenLine===null){
      spokenLine=n;
      return;
    }
    if(spokenWord===null){
      spokenWord=n;
      reveal(spokenLine,spokenWord);
    }
  }

  function reveal(lineNo,wordNo){
    if(locked || !Number.isInteger(lineNo) || !Number.isInteger(wordNo)) return;
    if(lineNo<1 || lineNo>BOOK_LINES.length) return;
    const ws=splitBookWords(BOOK_LINES[lineNo-1]);
    if(wordNo<1 || wordNo>ws.length) return;

    locked=true;
    wordEl.textContent=ws[wordNo-1].toUpperCase();
    fitWord();
    try{if(rec)rec.stop()}catch(e){}
    running=false;
  }

  function startRecognition(){
    // Show only the black stage immediately.
    cover.style.display="none";
    stage.style.display="block";
    wordEl.textContent="";
    resetSpokenCommand();

    // Request fullscreen, but DO NOT await it: on Android, waiting here can lose
    // the original user gesture before the microphone is started.
    try{
      const el=document.documentElement;
      if(!document.fullscreenElement && el.requestFullscreen){
        el.requestFullscreen({navigationUI:"hide"}).catch(()=>{});
      }
    }catch(e){}

    if(!SR){
      wordEl.textContent="CHROME";
      fitWord();
      return;
    }

    try{ if(rec) rec.abort(); }catch(e){}
    running=false;

    rec=new SR();
    rec.lang="fr-FR";

    // Android/Chrome is generally more reliable with one utterance at a time.
    // "ligne 2 premier mot" is a complete utterance, so continuous mode is not needed.
    rec.continuous=false;
    rec.interimResults=true;
    rec.maxAlternatives=5;

    rec.onresult=e=>{
      for(let i=e.resultIndex;i<e.results.length;i++){
        for(let a=0;a<e.results[i].length;a++){
          const heard=e.results[i][a].transcript;
          handleSpeech(heard);
          if(locked) return;
        }
      }
    };

    rec.onend=()=>{
      running=false;
      // No automatic loop here: this avoids the repeated Samsung/Android
      // "recording paused" notification.
    };

    rec.onerror=e=>{
      running=false;
      // Keep the screen black. No visible error message during performance.
    };

    try{
      rec.start();
      running=true;
    }catch(e){}
  }

  cover.addEventListener("pointerup",startRecognition,{once:true});

  stage.addEventListener("click",()=>{
    if(!locked){
      // Silent retry if Android stopped listening before the command was spoken.
      startRecognition();
      return;
    }

    // One tap after the revealed word prepares the next trick immediately.
    locked=false;
    resetSpokenCommand();
    wordEl.textContent="";
    try{ if(rec) rec.abort(); }catch(e){}
    running=false;
    startRecognition();
  });

  addEventListener("resize",fitWord);
})();
</script>
</body>
</html>
